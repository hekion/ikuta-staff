<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="../auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>落とし物管理 | Ikuta-Portal</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 検索・操作エリア */
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { flex: 1; padding: 12px; border: 2px solid #35A0D9; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 16px; }
        .add-btn { background: #35A0D9; color: #fff; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; height: 48px; white-space: nowrap; }

        /* リストデザイン */
        #lost-items-body { display: flex; flex-direction: column; gap: 15px; }
        .item-card { background: #fff; border-radius: 12px; border: 1px solid #ddd; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* 日付・担当者エリア */
        .card-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .display-date { font-size: 1.2rem; font-weight: bold; color: #333; }
        .display-staff { font-size: 0.85rem; color: #666; }

        /* メイン情報（写真・名前） */
        .card-middle { display: flex; gap: 15px; align-items: flex-start; margin-bottom: 12px; }
        .display-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; background: #eee; cursor: zoom-in; flex-shrink: 0; }
        .main-info { flex: 1; }
        .display-name { font-size: 1.4rem; font-weight: bold; color: #000; margin-bottom: 4px; display: block; }
        .display-category { display: inline-block; background: #f0f4f8; color: #35A0D9; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }

        /* 場所情報 */
        .location-info { font-size: 0.95rem; color: #444; margin-bottom: 8px; line-height: 1.6; }
        .location-info b { color: #888; font-weight: normal; margin-right: 4px; }

        /* 返却情報（持ち主） */
        .return-info { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 0.9rem; color: #444; }
        .status-area { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }

        /* 共通パーツ */
        .status-badge { padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; color: #fff; }
        .status-保管中 { background: #35A0D9; }
        .status-引取予定 { background: #F0AD4E; }
        .status-返却済 { background: #777; }
        .edit-btn { background: #f8f8f8; border: 1px solid #ccc; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* モーダル */
        .modal { display: none; position: fixed; z-index: 3000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); overflow-y: auto; }
        .modal-content { background: #fff; margin: 20px auto; padding: 20px; width: 92%; max-width: 450px; border-radius: 12px; box-sizing: border-box; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .zoom-modal { display: none; position: fixed; z-index: 4000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .zoom-modal img { max-width: 95%; max-height: 95%; }

        .submit-btn { background: #35A0D9; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; }
        .cancel-btn { background: none; border: none; color: #999; width: 100%; margin-top: 15px; cursor: pointer; text-align: center; display: block; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <header>
            <a href="../" style="text-decoration: none; display: inline-block;">
                <img src="../assets/images/ikutalogo.png" alt="FRONTOWN IKUTA">
                <div class="sub-title">STAFF PORTAL</div>
            </a>
        </header>
        <nav class="nav-menu">
            <ul>
                <li><a href="../manual/">マニュアル</a></li>
                <li><a href="../setup/">準備物</a></li>
                <li><a href="../roster/">名簿</a></li>
                <li><a href="../inventory/">備品検索</a></li>
                <li><a href="../pop/">掲示物</a></li>
                <li><a href="../contacts/">連絡先</a></li>
            </ul>
        </nav>
    </div>

    <main class="container">
        <div class="search-container">
            <input type="text" id="search-input" class="search-box" placeholder="名前・場所・持主で検索..." oninput="filterItems()">
            <button class="add-btn" onclick="openModal()">＋ 新規登録</button>
        </div>

        <div id="loading-msg" style="text-align:center; padding:20px;">読み込み中...</div>
        <div id="lost-items-body"></div>
    </main>

    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()"><img id="zoomedImg" src=""></div>

    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="border-bottom: 3px solid #35A0D9; padding-bottom: 10px; margin-top: 0;">落とし物登録</h3>
            <form id="lostItemForm">
                <input type="hidden" id="f-rowId">
                <div class="form-group"><label>日付</label><input type="date" id="f-date" required></div>
                <div class="form-group"><label>担当者</label><input type="text" id="f-staff" list="staff-list" required><datalist id="staff-list"><option value="スタッフA"><option value="スタッフB"></datalist></div>
                <div class="form-group"><label>拾得場所</label><input type="text" id="f-place" list="place-list" required><datalist id="place-list"><option value="受付"><option value="ラウンジ"><option value="テニスコート"></datalist></div>
                <div class="form-group"><label>拾得物の名前</label><input type="text" id="f-name" required></div>
                <div class="form-group"><label>カテゴリ</label><select id="f-category"><option>貴重品</option><option>衣類</option><option>スポーツ用品</option><option>雑貨・その他</option></select></div>
                <div class="form-group"><label>保管場所</label><input type="text" id="f-storage" list="storage-list" required><datalist id="storage-list"><option value="事務室棚"><option value="受付カウンター下"></datalist></div>
                <div class="form-group"><label>状態</label><select id="f-status"><option>保管中</option><option>引取予定</option><option>返却済</option></select></div>
                <div class="form-group"><label>写真</label><input type="file" id="f-photo" accept="image/*"></div>
                <div style="background:#f9f9f9; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #eee;">
                    <p style="margin:0 0 10px 0; font-size:0.8rem; font-weight:bold; color:#888;">持ち主・返却情報</p>
                    <div class="form-group"><label>持ち主の名前</label><input type="text" id="f-owner"></div>
                    <div class="form-group"><label>連絡先</label><input type="text" id="f-contact"></div>
                    <div class="form-group"><label>引取り予定日</label><input type="date" id="f-returnDate"></div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">保存する</button>
                <button type="button" class="cancel-btn" onclick="closeModal()">キャンセル</button>
            </form>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyDecF0oQvA5i82U8dZR66YOQ_QdRPxGEOY'; 
        const SPREADSHEET_ID = '1Fh4Z7f7Jau8d_FMT__sGjp-99Ks-IHKQl5kaGERM2Rg'; 
        const RANGE = '落とし物リスト!A2:K500'; 
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyNblFICpqoHl_z0RRe-i4zR3KjtDuXiStqG3seGzX2wGgf_CNGJJSVeRjzVr4iJI9_1w/exec'; 

        let lostData = [];

        async function loadData() {
            try {
                const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(RANGE)}?key=${API_KEY}`);
                const json = await res.json();
                lostData = (json.values || []).map((r, index) => ({
                    rowId: index + 2, date: r[0]||'', staff: r[1]||'', place: r[2]||'', name: r[3]||'', category: r[4]||'',
                    photo: r[5]||'', storage: r[6]||'', status: r[7]||'保管中', owner: r[8]||'', contact: r[9]||'', returnDate: r[10]||''
                })).reverse();
                render(lostData);
                document.getElementById('loading-msg').classList.add('hidden');
            } catch(e) { document.getElementById('loading-msg').innerText = "取得失敗"; }
        }

        function render(data) {
            const container = document.getElementById('lost-items-body'); container.innerHTML = '';
            data.forEach(i => {
                let imgUrl = i.photo;
                if (imgUrl && imgUrl.includes('id=')) {
                    const id = imgUrl.split('id=')[1];
                    imgUrl = `https://lh3.googleusercontent.com/u/0/d/${id}=s300`;
                }
                const fallback = 'https://via.placeholder.com/150?text=No+Photo';
                
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="display-date">${i.date}</span>
                        <span class="display-staff">担当: ${i.staff}</span>
                    </div>
                    <div class="card-middle">
                        <img src="${imgUrl || fallback}" class="display-img" onerror="this.src='${fallback}'" onclick="zoomImg(this.src)">
                        <div class="main-info">
                            <span class="display-name">${i.name}</span>
                            <span class="display-category">${i.category}</span>
                        </div>
                    </div>
                    <div class="location-info">
                        <b>拾得場所/</b> ${i.place} &nbsp;&nbsp; <b>保管場所/</b> ${i.storage}
                    </div>
                    ${(i.owner || i.contact || i.returnDate) ? `
                    <div class="return-info">
                        <div><b>持ち主の名前</b> ${i.owner || '未記入'}</div>
                        <div><b>連絡先</b> ${i.contact || '未記入'} &nbsp;&nbsp; <b>引取予定日</b> ${i.returnDate || '未記入'}</div>
                    </div>` : ''}
                    <div class="status-area">
                        <span class="status-badge status-${i.status}">${i.status}</span>
                        <button class="edit-btn" onclick="editItem(${i.rowId})">編集</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function zoomImg(src) { document.getElementById('zoomedImg').src = src.split('=')[0] + '=s1200'; document.getElementById('zoomModal').style.display = 'flex'; }
        function closeZoom() { document.getElementById('zoomModal').style.display = 'none'; }
        function openModal() { document.getElementById('itemModal').style.display = 'block'; }
        function closeModal() { document.getElementById('itemModal').style.display = 'none'; document.getElementById('lostItemForm').reset(); document.getElementById('f-rowId').value = ''; }

        function editItem(rowId) {
            const item = lostData.find(i => i.rowId === rowId);
            if (!item) return;
            document.getElementById('f-rowId').value = item.rowId;
            document.getElementById('f-date').value = item.date;
            document.getElementById('f-staff').value = item.staff;
            document.getElementById('f-place').value = item.place;
            document.getElementById('f-name').value = item.name;
            document.getElementById('f-category').value = item.category;
            document.getElementById('f-storage').value = item.storage;
            document.getElementById('f-status').value = item.status;
            document.getElementById('f-owner').value = item.owner;
            document.getElementById('f-contact').value = item.contact;
            document.getElementById('f-returnDate').value = item.returnDate;
            openModal();
        }

        function filterItems() {
            const q = document.getElementById('search-input').value.toLowerCase();
            render(lostData.filter(i => i.name.toLowerCase().includes(q) || i.place.toLowerCase().includes(q) || i.owner.toLowerCase().includes(q)));
        }

        document.getElementById('lostItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "送信中...";
            const file = document.getElementById('f-photo').files[0];
            let base64 = null;
            if (file) {
                base64 = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file); });
            }
            const payload = {
                rowId: document.getElementById('f-rowId').value, date: document.getElementById('f-date').value,
                staff: document.getElementById('f-staff').value, place: document.getElementById('f-place').value,
                name: document.getElementById('f-name').value, category: document.getElementById('f-category').value,
                storage: document.getElementById('f-storage').value, status: document.getElementById('f-status').value,
                owner: document.getElementById('f-owner').value || "", contact: document.getElementById('f-contact').value || "",
                returnDate: document.getElementById('f-returnDate').value || "", photoBase64: base64, photoName: file ? file.name : null
            };
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("送信完了！"); closeModal(); loadData();
            } catch (e) { alert("失敗"); }
            btn.disabled = false; btn.innerText = "保存する";
        });

        loadData();
    </script>
</body>
</html>
