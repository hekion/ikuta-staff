<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ikuta-Portal</title>
    <script src="auth.js"></script>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- シフト・表示エリア（変更なし） --- */
        .daily-info { text-align: center; background: #fff; padding: 20px; border-bottom: 2px solid #eee; }
        .today-header { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; color: #333; }
        .topics-container { margin-bottom: 25px; display: inline-block; text-align: left; width: 95%; max-width: 800px; }
        .info-label { font-size: 0.75rem; font-weight: bold; color: #78909c; margin-bottom: 4px; display: block; }
        .topics-box { background-color: #e3f2fd; border: 1px solid #90caf9; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; }
        .shift-grid { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .shift-box { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px 20px; width: 95%; max-width: 800px; box-sizing: border-box; }
        .shift-title { font-weight: bold; border-bottom: 2px solid; margin-bottom: 10px; padding-bottom: 5px; }
        .early { border-color: #f0ad4e; color: #8a6d3b; }   
        .late { border-color: #5bc0de; color: #31708f; }    
        .tomorrow { border-color: #5cb85c; color: #3c763d; } 
        .staff-list { font-size: 1rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; color: #444; }

        /* --- メモエリア：落とし物管理方式のスタイル（スマホズーム防止） --- */
        .memo-section { width: 95%; max-width: 800px; margin: 20px auto 0; text-align: left; background: #fdfdfd; padding: 15px; border-radius: 10px; border: 1px solid #eee; box-sizing: border-box; }
        .memo-input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        
        /* 落とし物管理と同じ16px設定：これでズームを防ぐ */
        .memo-input-group input, 
        .memo-input-group textarea { 
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; 
            font-size: 16px !important; outline: none; background: #fff; -webkit-appearance: none;
        }
        .create-btn { background: #35A0D9; color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }

        .memo-item { background: white; border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .memo-item.completed { opacity: 0.5; background: #f9f9f9; }
        .memo-meta { font-size: 0.7rem; color: #999; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .memo-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .action-btn { font-size: 0.8rem; padding: 6px 15px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="daily-info">
        <div class="today-header" id="today-date">読み込み中...</div>
        
        <div class="topics-container" id="topics-area" style="display: none;">
            <span class="info-label">INFO</span>
            <div class="topics-box" id="today-topics"></div>
        </div>
        
        <div class="shift-grid">
            <div class="shift-box"><div class="shift-title early">今日の早番</div><div class="staff-list" id="early-staff">ー</div></div>
            <div class="shift-box"><div class="shift-title late">今日の遅番</div><div class="staff-list" id="late-staff">ー</div></div>
            <div class="shift-box"><div class="shift-title tomorrow">明日の早番</div><div class="staff-list" id="tomorrow-early">ー</div></div>
        </div>

        <section class="memo-section">
            <span class="info-label">引き継ぎメモ</span>
            <div class="memo-input-group">
                <input type="text" id="memo-author" placeholder="記入者名">
                <textarea id="memo-content" rows="2" placeholder="共有事項を入力..."></textarea>
                <button class="create-btn" id="create-btn" onclick="handleMemo('create')">保存する</button>
            </div>
            <div id="memo-list"></div>
        </section>
    </div>

    <main class="container">
        <section class="tool-links">
            <h2>外部ツール</h2>
            <div class="grid">
                <a href="https://ikuta-frontown-admin.hacomono.jp/#/schedule/tables/1/studio-rooms/4/" target="_blank" rel="noopener noreferrer" class="card">
                    <img src="assets/images/hacomono.png" alt="hacomono" style="max-width: 150px; width: 100%; height: auto;">
                </a>
                <a href="https://yoyaku.labola.jp/r/shop/manage/top/" target="_blank" rel="noopener noreferrer" class="card">
                    <img src="assets/images/LaBOLA.png" alt="LaBOLA" style="max-width: 150px; width: 100%; height: auto;">
                </a>
                <a href="https://www.chatwork.com/" target="_blank" rel="noopener noreferrer" class="card">
                    <img src="assets/images/chatwork.png" alt="Chatwork" style="max-width: 150px; width: 100%; height: auto;">
                </a>
            </div>
        </section>

        <section class="internal-links">
            <h2>業務メニュー</h2>
            <div class="grid">
                <a href="manual/" class="card"><div class="icon">📖</div><span>マニュアル</span></a>
                <a href="setup/" class="card"><div class="icon">📋</div><span>準備物</span></a>
                <a href="lost/" class="card"><div class="icon">🔍</div><span>落とし物管理</span></a>
                <a href="roster/" class="card"><div class="icon">👥</div><span>名簿</span></a>
                <a href="inventory/" class="card"><div class="icon">📦</div><span>備品・物品検索</span></a>
                <a href="pop/" class="card"><div class="icon">🖼️</div><span>掲示物</span></a>
                <a href="contacts/" class="card"><div class="icon">📞</div><span>連絡先</span></a>
            </div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwauQN0cQ-umfDBgapM0_gNylA1Yc7aqT_xfGRs1GWFr8KiDhNKkPns-tWPpj4seTiZzQ/exec";

        async function fetchShift() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                document.getElementById('today-date').textContent = data.date;
                
                const topicsArea = document.getElementById('topics-area');
                if (data.topics) {
                    document.getElementById('today-topics').innerHTML = data.topics.replace(/[,，/／、]/g, '<br>');
                    topicsArea.style.display = "inline-block";
                }

                const fmt = (list) => list && list.length > 0 ? list.map(n => `<span>${n}</span>`).join('') : "ー";
                document.getElementById('early-staff').innerHTML = fmt(data.early);
                document.getElementById('late-staff').innerHTML = fmt(data.late);
                document.getElementById('tomorrow-early').innerHTML = fmt(data.tomorrowEarly);

                // メモ一覧表示
                const listEl = document.getElementById('memo-list');
                if (data.memos && data.memos.length > 0) {
                    listEl.innerHTML = data.memos.map(m => `
                        <div class="memo-item ${m.status === '完了' ? 'completed' : ''}">
                            <div class="memo-meta"><span>${m.author}</span><span>${new Date(m.date).toLocaleDateString('ja-JP')}</span></div>
                            <div style="font-size:1rem; line-height:1.5; white-space:pre-wrap;">${m.content}</div>
                            <div class="memo-actions">
                                ${m.status === '未完了' ? `<button class="action-btn" style="color:#5cb85c;" onclick="handleMemo('complete', '${m.id}')">完了</button>` : ''}
                                <button class="action-btn" style="color:#d9534f;" onclick="handleMemo('delete', '${m.id}')">削除</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = '<div style="text-align:center; color:#ccc; font-size:0.8rem; padding:10px;">現在メモはありません</div>';
                }
            } catch (e) { console.error(e); }
        }

        // 落とし物管理と同じ「送信即リロード」方式
        async function handleMemo(action, id = null) {
            const author = document.getElementById('memo-author').value.trim();
            const content = document.getElementById('memo-content').value.trim();
            const btn = document.getElementById('create-btn');

            if (action === 'create' && (!author || !content)) return alert("記入者名と内容を入力してください");

            btn.disabled = true;
            btn.textContent = "送信中...";

            try {
                // 落とし物管理と全く同じ fetch 方式（mode: 'no-cors'）
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors", 
                    body: JSON.stringify({ action, id, author, content })
                });

                alert("保存しました");
                location.reload(); // 落とし物管理と同じくリロードして確実に最新化

            } catch (e) {
                alert("送信エラー");
                btn.disabled = false;
                btn.textContent = "保存する";
            }
        }

        fetchShift();
    </script>
</body>
</html>
