<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikuta-Portal</title>
    <script src="auth.js"></script>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .daily-info {
            text-align: center;
            background: #fff;
            padding: 20px;
            margin: 10px 0 25px 0;
            border-bottom: 2px solid #eee;
        }
        
        .today-header { 
            font-size: 1.5rem; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #333;
        }

        /* シフトエリア */
        .shift-grid {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .shift-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 20px;
            width: 95%; 
            max-width: 800px; 
            box-sizing: border-box;
        }

        .shift-title { 
            font-weight: bold; 
            border-bottom: 2px solid; 
            margin-bottom: 10px; 
            padding-bottom: 5px;
        }
        
        .early { border-color: #f0ad4e; color: #8a6d3b; }   
        .late { border-color: #5bc0de; color: #31708f; }    
        .tomorrow { border-color: #5cb85c; color: #3c763d; } 

        .staff-list { 
            font-size: 1rem; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px; 
            color: #444;
        }

        /* メモセクション（下配置） */
        .memo-section {
            width: 95%;
            max-width: 800px;
            margin: 20px auto;
            text-align: left;
            background: #fdfdfd;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #78909c;
            margin-bottom: 8px;
            display: block;
        }

        .memo-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .memo-input-group input, 
        .memo-input-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .create-btn {
            background: #35A0D9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .memo-item {
            background: white;
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .memo-item.completed { opacity: 0.5; background: #f9f9f9; }

        .memo-meta {
            font-size: 0.7rem;
            color: #999;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .memo-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .action-btn {
            font-size: 0.7rem;
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sns-icons { justify-content: space-between !important; padding: 0 15px; }
            .sns-icons a { font-size: 1.6rem; flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="daily-info">
        <div class="today-header" id="today-date">読み込み中...</div>
        
        <div class="shift-grid">
            <div class="shift-box">
                <div class="shift-title early">今日の早番</div>
                <div class="staff-list" id="early-staff">ー</div>
            </div>
            <div class="shift-box">
                <div class="shift-title late">今日の遅番</div>
                <div class="staff-list" id="late-staff">ー</div>
            </div>
            <div class="shift-box">
                <div class="shift-title tomorrow">明日の早番</div>
                <div class="staff-list" id="tomorrow-early">ー</div>
            </div>
        </div>

        <section class="memo-section">
            <span class="info-label">引き継ぎメモ（共有・申し送り）</span>
            <div class="memo-input-group">
                <input type="text" id="memo-author" placeholder="記入者名">
                <textarea id="memo-content" placeholder="内容を入力..."></textarea>
                <button class="create-btn" id="create-btn" onclick="handleMemo('create')">メモを作成</button>
            </div>
            <div id="memo-list"></div>
        </section>
    </div>

    <main class="container">
        </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxvu-TIXGlU8M2ifIQyUyz1GrzV_9mkpUd0whuvxf7yX29Cdrga33Fw_gqOwU-UfojxlA/exec";

        function updateUI(data) {
            if (data.error) { document.getElementById('today-date').textContent = data.error; return; }
            document.getElementById('today-date').textContent = data.date;
            
            const formatStaff = (list) => list && list.length > 0 ? list.map(n => `<span>${n}</span>`).join('') : "ー";
            document.getElementById('early-staff').innerHTML = formatStaff(data.early);
            document.getElementById('late-staff').innerHTML = formatStaff(data.late);
            document.getElementById('tomorrow-early').innerHTML = formatStaff(data.tomorrowEarly);

            const listEl = document.getElementById('memo-list');
            if (data.memos && data.memos.length > 0) {
                listEl.innerHTML = data.memos.map(m => `
                    <div class="memo-item ${m.status === '完了' ? 'completed' : ''}">
                        <div class="memo-meta">
                            <span>${m.author}</span>
                            <span>${new Date(m.date).toLocaleDateString('ja-JP')}</span>
                        </div>
                        <div style="font-size:0.95rem; line-height:1.5;">${m.content}</div>
                        <div class="memo-actions">
                            ${m.status === '未完了' ? `<button class="action-btn" style="color:#5cb85c; border-color:#5cb85c;" onclick="handleMemo('complete', '${m.id}')">完了</button>` : ''}
                            <button class="action-btn" style="color:#d9534f; border-color:#d9534f;" onclick="handleMemo('delete', '${m.id}')">削除</button>
                        </div>
                    </div>
                `).join('');
            } else {
                listEl.innerHTML = '<div style="text-align:center; color:#ccc; font-size:0.8rem; padding:10px;">現在メモはありません</div>';
            }
        }

        async function fetchAll() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                updateUI(data);
            } catch (e) { console.error(e); }
        }

        async function handleMemo(action, id = null) {
            const author = document.getElementById('memo-author').value.trim();
            const content = document.getElementById('memo-content').value.trim();
            const btn = document.getElementById('create-btn');

            if (action === 'create' && (!author || !content)) return alert("名前と内容を入力してください");

            btn.disabled = true;
            btn.textContent = "送信中...";

            try {
                // POST送信を確実に行うための設定
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors", // 重要：CORSエラー回避
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action, id, author, content })
                });

                // no-cors の場合レスポンスが取れないため、少し待ってから再取得
                setTimeout(() => {
                    if (action === 'create') document.getElementById('memo-content').value = '';
                    btn.disabled = false;
                    btn.textContent = "メモを作成";
                    fetchAll();
                }, 1000);

            } catch (e) {
                alert("送信エラーが発生しました");
                btn.disabled = false;
                btn.textContent = "メモを作成";
            }
        }

        fetchAll();
    </script>
</body>
</html>
