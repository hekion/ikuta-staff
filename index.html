<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ikuta-Portal</title>
    <script src="auth.js"></script>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .daily-info { text-align: center; background: #fff; padding: 20px; border-bottom: 2px solid #eee; }
        .today-header { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; color: #333; }
        .topics-container { margin-bottom: 25px; display: inline-block; text-align: left; width: 95%; max-width: 800px; }
        .info-label { font-size: 0.75rem; font-weight: bold; color: #78909c; margin-bottom: 4px; display: block; }
        .topics-box { background-color: #e3f2fd; border: 1px solid #90caf9; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; }
        
        .shift-grid { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .shift-box { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px 20px; width: 95%; max-width: 800px; box-sizing: border-box; }
        .shift-title { font-weight: bold; border-bottom: 2px solid; margin-bottom: 10px; padding-bottom: 5px; }
        .early { border-color: #f0ad4e; color: #8a6d3b; }   
        .late { border-color: #5bc0de; color: #31708f; }    
        .tomorrow { border-color: #5cb85c; color: #3c763d; } 

        .staff-list { font-size: 1rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px 25px; color: #444; }
        .staff-list span { white-space: nowrap; }

        .memo-section { width: 95%; max-width: 800px; margin: 20px auto 0; text-align: left; background: #fdfdfd; padding: 15px; border-radius: 10px; border: 1px solid #eee; box-sizing: border-box; overflow: hidden; }
        .memo-input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; width: 100%; }
        
        .memo-input-group input, .memo-input-group textarea { 
            width: 100% !important; 
            max-width: 100% !important;
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px !important; 
            outline: none; 
            background: #fff;
            -webkit-appearance: none;
        }
        
        .create-btn { background: #35A0D9; color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; box-sizing: border-box; }

        .memo-item { background: white; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 12px; word-wrap: break-word; }
        .memo-meta { font-size: 0.9rem; font-weight: bold; color: #444; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; margin-bottom: 8px; }
        .status-badge { float: right; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; }
        .badge-wait { background: #E3F2FD; color: #35A0D9; border: 1px solid #35A0D9; }
        .badge-done { background: #eee; color: #888; border: 1px solid #ccc; }
        .item-done { background-color: #f5f5f5 !important; border-color: #ddd; opacity: 0.8; }
        .item-done .memo-content { color: #888; text-decoration: none; }

        .memo-btns { text-align: right; margin-top: 10px; }
        .memo-btns button { font-size: 0.8rem; padding: 6px 12px; margin-left: 8px; border-radius: 4px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
        .edit-active { border: 2px solid #fdd835 !important; background: #fffde7; }
    </style>
</head>
<body>

    <div class="daily-info">
        <div class="today-header" id="today-date">読み込み中...</div>
        <div class="topics-container" id="topics-area" style="display: none;">
            <span class="info-label">INFO</span>
            <div class="topics-box" id="today-topics"></div>
        </div>
        <div class="shift-grid">
            <div class="shift-box"><div class="shift-title early">今日の早番</div><div class="staff-list" id="early-staff">ー</div></div>
            <div class="shift-box"><div class="shift-title late">今日の遅番</div><div class="staff-list" id="late-staff">ー</div></div>
            <div class="shift-box"><div class="shift-title tomorrow">明日の早番</div><div class="staff-list" id="tomorrow-early">ー</div></div>
        </div>

        <section class="memo-section">
            <span class="info-label" id="memo-label">引き継ぎメモ登録</span>
            <div class="memo-input-group">
                <input type="date" id="memo-date">
                <input type="text" id="memo-author" placeholder="記入者氏名">
                <textarea id="memo-content" rows="3" placeholder="内容を入力"></textarea>
                <input type="hidden" id="edit-old-content">
                <button class="create-btn" id="create-btn" onclick="handleMemo('create')">登録する</button>
            </div>
            <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">
            <div id="memo-list"></div>
        </section>
    </div>

    <main class="container">
        <section class="tool-links">
            <h2>外部ツール</h2>
            <div class="grid">
                <a href="https://ikuta-frontown-admin.hacomono.jp/#/schedule/tables/1/studio-rooms/4/" target="_blank" class="card"><img src="assets/images/hacomono.png" alt="hacomono" style="max-width: 150px; width: 100%;"></a>
                <a href="https://yoyaku.labola.jp/r/shop/manage/top/" target="_blank" class="card"><img src="assets/images/LaBOLA.png" alt="LaBOLA" style="max-width: 150px; width: 100%;"></a>
                <a href="https://www.chatwork.com/" target="_blank" class="card"><img src="assets/images/chatwork.png" alt="Chatwork" style="max-width: 150px; width: 100%;"></a>
            </div>
        </section>

        <section class="internal-links">
            <h2>業務メニュー</h2>
            <div class="grid">
                <a href="manual/" class="card"><div class="icon">📖</div><span>マニュアル</span></a>
                <a href="setup/" class="card"><div class="icon">📋</div><span>準備物</span></a>
                <a href="lost/" class="card"><div class="icon">🔍</div><span>落とし物管理</span></a>
                <a href="roster/" class="card"><div class="icon">👥</div><span>名簿</span></a>
                <a href="inventory/" class="card"><div class="icon">📦</div><span>備品・物品検索</span></a>
                <a href="pop/" class="card"><div class="icon">🖼️</div><span>掲示物</span></a>
                <a href="contacts/" class="card"><div class="icon">📞</div><span>連絡先</span></a>
            </div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyLoMrSOWEeRqFadT3-EE-rSLSnxhD8NKMUvnf2_vrWJ-QMtoty2grp4jBH1ylLDcdaOQ/exec";

        window.onload = () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            document.getElementById('memo-date').value = `${y}-${m}-${d}`;
            fetchShift();
        };

        async function fetchShift() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                document.getElementById('today-date').textContent = data.date;
                const topicsArea = document.getElementById('topics-area');
                if (data.topics && data.topics.trim() !== "" && data.topics !== ",") {
                    document.getElementById('today-topics').innerHTML = data.topics.replace(/[,，/／、]/g, '<br>');
                    topicsArea.style.display = "inline-block";
                }
                const fmt = (list) => list && list.length > 0 ? list.map(n => `<span>${n}</span>`).join('') : "ー";
                document.getElementById('early-staff').innerHTML = fmt(data.early || []);
                document.getElementById('late-staff').innerHTML = fmt(data.late || []);
                document.getElementById('tomorrow-early').innerHTML = fmt(data.tomorrowEarly || []);

                const listEl = document.getElementById('memo-list');
                if (data.memos && data.memos.length > 0) {
                    // ソート処理の修正
                    const sorted = data.memos.sort((a, b) => {
                        // 1. まずステータスで比較（「対応中」を上、「完了」を下にする）
                        if (a.status === '対応中' && b.status === '完了') return -1;
                        if (a.status === '完了' && b.status === '対応中') return 1;

                        // 2. ステータスが同じなら、日付の新しい順にする
                        const dateA = new Date(a.date.includes('/') ? `${new Date().getFullYear()}/${a.date}` : a.date);
                        const dateB = new Date(b.date.includes('/') ? `${new Date().getFullYear()}/${b.date}` : b.date);
                        return dateB - dateA;
                    });

                    listEl.innerHTML = sorted.map(m => {
                        const isDone = m.status === '完了';
                        return `
                        <div class="memo-item ${isDone ? 'item-done' : ''}">
                            <span class="status-badge ${isDone ? 'badge-done' : 'badge-wait'}">${m.status}</span>
                            <div class="memo-meta">${m.date}　${m.author}</div>
                            <div class="memo-content" style="white-space:pre-wrap;">${m.content}</div>
                            <div class="memo-btns">
                                ${!isDone ? `<button onclick="startEdit('${m.date}', '${m.author}', \`${m.content.replace(/`/g, '\\`')}\`)">編集</button>` : ''}
                                ${!isDone ? `<button onclick="handleMemo('update', '${m.author}', '${m.content}')">完了</button>` : ''}
                                <button onclick="handleMemo('delete', '${m.author}', '${m.content}')" style="color:red;">削除</button>
                            </div>
                        </div>
                        `;
                    }).join('');
                }
            } catch (e) { console.error(e); }
        }

        function startEdit(date, author, content) {
            document.getElementById('memo-label').textContent = "⚠️ メモ編集モード";
            const dParts = date.split('/');
            if(dParts.length === 2) {
                const y = new Date().getFullYear();
                const m = dParts[0].padStart(2, '0');
                const d = dParts[1].padStart(2, '0');
                document.getElementById('memo-date').value = `${y}-${m}-${d}`;
            }
            document.getElementById('memo-author').value = author;
            document.getElementById('memo-content').value = content;
            document.getElementById('edit-old-content').value = content;
            document.getElementById('memo-content').classList.add('edit-active');
            const btn = document.getElementById('create-btn');
            btn.textContent = "上書き保存する";
            btn.style.background = "#fdd835";
            btn.style.color = "#333";
            btn.onclick = () => handleMemo('edit_save');
            window.scrollTo(0, 0);
        }

        async function handleMemo(action, authorOverride, contentOverride) {
            const dateInput = document.getElementById('memo-date').value;
            const d = new Date(dateInput);
            const formattedDate = (d.getMonth() + 1) + "/" + d.getDate();
            const author = authorOverride || document.getElementById('memo-author').value.trim();
            const content = contentOverride || document.getElementById('memo-content').value.trim();
            const oldContent = document.getElementById('edit-old-content').value;
            if (!author || !content) return alert("入力不足です");
            if (action === 'delete' && !confirm('削除しますか？')) return;
            try {
                await fetch(GAS_URL, {
                    method: "POST", mode: "no-cors",
                    body: JSON.stringify({ action, date: formattedDate, author, content, oldContent })
                });
                location.reload();
            } catch (e) { alert("エラー"); }
        }
    </script>
</body>
</html>
